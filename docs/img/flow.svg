<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="300" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">devchip.py: from Verilog to a running FPGA</text>

  <text x="24" y="62" font-size="13" font-weight="600" fill="#1d4ed8">BUILD (on your computer)</text>
  <g font-size="13">
    <rect x="20" y="75" width="130" height="62" rx="9" fill="#f8fafc" stroke="#334155"/>
    <text x="85" y="102" text-anchor="middle" font-weight="600" fill="#0f172a">your .v files</text>
    <text x="85" y="121" text-anchor="middle" font-size="11" fill="#475569">+ devchip.json</text>

    <rect x="180" y="75" width="130" height="62" rx="9" fill="#ffffff" stroke="#334155"/>
    <text x="245" y="102" text-anchor="middle" font-weight="600" fill="#0f172a">Yosys</text>
    <text x="245" y="121" text-anchor="middle" font-size="11" fill="#475569">synth_gowin</text>

    <rect x="340" y="75" width="130" height="62" rx="9" fill="#fef2f2" stroke="#dc2626"/>
    <text x="405" y="102" text-anchor="middle" font-weight="600" fill="#991b1b">pin safety check</text>
    <text x="405" y="121" text-anchor="middle" font-size="11" fill="#991b1b">board/pins.csv</text>

    <rect x="500" y="75" width="130" height="62" rx="9" fill="#ffffff" stroke="#334155"/>
    <text x="565" y="102" text-anchor="middle" font-weight="600" fill="#0f172a">nextpnr</text>
    <text x="565" y="121" text-anchor="middle" font-size="11" fill="#475569">place, route, timing</text>

    <rect x="660" y="75" width="130" height="62" rx="9" fill="#ffffff" stroke="#334155"/>
    <text x="725" y="102" text-anchor="middle" font-weight="600" fill="#0f172a">gowin_pack</text>
    <text x="725" y="121" text-anchor="middle" font-size="11" fill="#475569">Apicula</text>

    <rect x="820" y="75" width="120" height="62" rx="9" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="880" y="102" text-anchor="middle" font-weight="600" fill="#0f172a">pack.fs</text>
    <text x="880" y="121" text-anchor="middle" font-size="11" fill="#475569">+ report.txt</text>
  </g>
  <g stroke="#334155" stroke-width="1.6" marker-end="url(#a)">
    <line x1="150" y1="106" x2="178" y2="106"/><line x1="310" y1="106" x2="338" y2="106"/>
    <line x1="470" y1="106" x2="498" y2="106"/><line x1="630" y1="106" x2="658" y2="106"/>
    <line x1="790" y1="106" x2="818" y2="106"/>
  </g>

  <path d="M880,137 L880,165 L85,165 L85,188" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>

  <text x="940" y="183" text-anchor="end" font-size="13" font-weight="600" fill="#1d4ed8">LOAD (over USB)</text>
  <g font-size="13">
    <rect x="20" y="190" width="130" height="66" rx="9" fill="#ffffff" stroke="#334155"/>
    <text x="85" y="216" text-anchor="middle" font-weight="600" fill="#0f172a">check device ID</text>
    <text x="85" y="235" text-anchor="middle" font-size="11" fill="#475569">must be GW2A-18</text>

    <rect x="180" y="190" width="160" height="66" rx="9" fill="#ffffff" stroke="#334155"/>
    <text x="260" y="216" text-anchor="middle" font-weight="600" fill="#0f172a">gzip + KISS frames</text>
    <text x="260" y="235" text-anchor="middle" font-size="11" fill="#475569">CP2105 Enhanced port</text>

    <rect x="370" y="190" width="170" height="66" rx="9" fill="#fef2f2" stroke="#dc2626"/>
    <text x="455" y="216" text-anchor="middle" font-weight="600" fill="#991b1b">MD5 must match</text>
    <text x="455" y="235" text-anchor="middle" font-size="11" fill="#991b1b">else nothing is programmed</text>

    <rect x="570" y="190" width="190" height="66" rx="9" fill="#ffffff" stroke="#334155"/>
    <text x="665" y="216" text-anchor="middle" font-weight="600" fill="#0f172a">openFPGALoader</text>
    <text x="665" y="235" text-anchor="middle" font-size="11" fill="#475569">-c dirtyJtag  -m (SRAM) / -f (flash)</text>

    <rect x="790" y="190" width="150" height="66" rx="9" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="865" y="216" text-anchor="middle" font-weight="600" fill="#0f172a">FPGA runs it</text>
    <text x="865" y="235" text-anchor="middle" font-size="11" fill="#475569">optional flash verify</text>
  </g>
  <g stroke="#334155" stroke-width="1.6" marker-end="url(#a)">
    <line x1="150" y1="223" x2="178" y2="223"/><line x1="340" y1="223" x2="368" y2="223"/>
    <line x1="540" y1="223" x2="568" y2="223"/><line x1="760" y1="223" x2="788" y2="223"/>
  </g>
  <text x="455" y="282" text-anchor="middle" font-size="11.5" fill="#64748b">From the upload onwards, the work happens on ChipLoader, the small Linux computer on the board, the same way the website uses it.</text>
</svg>
